<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="clanker">
<meta name="theme-color" content="#0A0E12">
<title>clanker</title>
<style>
  /* Single dark world on purpose: this is a phone app for a terminal tool, and
     it is looked at on a train and in bed. No light theme. */
  :root {
    --ground: #0A0E12; --panel: #141A21; --panel2: #1B232C; --rule: #232D38;
    --ink: #E4EAF0; --dim: #7C8A99; --faint: #46525F;
    --amber: #F0A830; --alert: #FF5C4D; --calm: #4DD0A7;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    max-width: 620px; margin-inline: auto;
    padding: env(safe-area-inset-top) 0 0;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---- masthead + view switcher -------------------------------------- */
  header { flex: none; padding: 12px 16px 0; }
  .top { display: flex; align-items: baseline; gap: 9px; margin-bottom: 12px; }
  .top h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; font-weight: 750; }
  .top .host {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim);
    letter-spacing: .08em; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%;
  }
  .top .host.alert { color: var(--alert); }
  .views { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 12px; }
  .views::-webkit-scrollbar { height: 0; }
  .vtab {
    appearance: none; cursor: pointer; flex: none;
    background: transparent; border: 1px solid var(--rule); color: var(--dim);
    border-radius: 999px; padding: 7px 14px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .11em; text-transform: uppercase;
  }
  .vtab[aria-selected="true"] {
    background: var(--amber); border-color: var(--amber); color: #0A0E12; font-weight: 700;
  }
  .vtab:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  main::-webkit-scrollbar { width: 0; }

  /* ---- shared primitives --------------------------------------------- */
  .lab {
    font-family: var(--mono); font-size: 10px; letter-spacing: .17em; text-transform: uppercase;
    color: var(--dim); padding: 0 16px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .lab::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .lab.alert { color: var(--alert); }
  .lab.alert::after { background: linear-gradient(90deg, #FF5C4D55, transparent); }

  .btn {
    appearance: none; cursor: pointer; font: inherit; border-radius: 9px;
    border: 1px solid var(--rule); background: var(--panel2); color: var(--ink);
    padding: 11px 13px; font-size: 14px; transition: filter .14s, transform .07s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #0A0E12; font-weight: 700; }
  .btn.danger { color: var(--alert); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .verbtag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; background: var(--panel2); color: var(--dim); flex: none;
  }
  .verbtag.implement { color: var(--amber); background: #F0A83018; }
  .verbtag.continue { color: #8AB4F8; background: #8AB4F818; }
  .verbtag.review { color: #C89BF0; background: #C89BF018; }

  .pip { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
  .pip.busy { background: var(--amber); }
  .pip.blocked { background: var(--alert); box-shadow: 0 0 0 3px #FF5C4D22; }
  .pip.done, .pip.stopped, .pip.stale { background: var(--faint); }

  .empty { color: var(--dim); font-size: 14px; padding: 14px 16px; }
  .empty.good { color: var(--calm); }

  /* ---- TRIAGE --------------------------------------------------------- */
  .card {
    margin: 0 12px 11px; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 15px; overflow: hidden;
  }
  .card.blocked { border-color: #FF5C4D55; background: linear-gradient(180deg, #FF5C4D0E, var(--panel) 62%); }
  .card-top { display: flex; align-items: center; gap: 9px; padding: 13px 14px 0; }
  .card-id { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .card-age { margin-left: auto; font-size: 12px; color: var(--dim); }
  .prev {
    margin: 10px 14px 0; padding: 11px 12px; background: #0A0E12; border: 1px solid var(--rule);
    border-radius: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    color: var(--dim); max-height: 132px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .prev b { color: var(--ink); font-weight: 600; }
  .acts { display: flex; gap: 7px; padding: 11px 14px 13px; }
  .acts .btn { flex: 1; padding: 11px 6px; font-size: 13px; text-align: center; }
  .acts a.btn { text-decoration: none; display: block; }

  .strip {
    display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  .strip:active { background: #FFFFFF08; }
  .strip .nm { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .strip .nm.unnamed { font-weight: 400; color: var(--dim); font-style: italic; font-family: inherit; }
  .strip .note {
    color: var(--dim); font-size: 12px; margin-left: auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 50%;
  }
  .rd { display: flex; gap: 7px; padding: 4px 16px 12px; flex-wrap: wrap; }
  .rd .btn { font-size: 12px; padding: 8px 11px; font-family: var(--mono); }

  /* ---- COMMAND -------------------------------------------------------- */
  .log { padding: 10px 16px 4px; font-family: var(--mono); font-size: 13px; line-height: 1.7; }
  .log .ln { display: flex; gap: 9px; }
  .log .ts { color: var(--faint); flex: none; }
  .log .ok { color: var(--calm); }
  .log .warn { color: var(--alert); }
  .log .mut { color: var(--dim); }
  .log .txt { word-break: break-word; }
  .ask {
    margin: 7px 0; padding: 10px 12px; border-left: 2px solid var(--alert);
    background: #FF5C4D0C; font-size: 13.5px; line-height: 1.5;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
  }
  .ask a { color: var(--amber); }
  .cmdrow {
    display: flex; align-items: center; gap: 9px; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 13px; padding: 12px 13px; margin: 0 12px;
  }
  .cmdrow:focus-within { border-color: var(--amber); }
  .cmdrow .caret { color: var(--amber); font-family: var(--mono); }
  .cmdrow input {
    flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink);
    font-family: var(--mono); font-size: 15px; outline: none;
  }
  .hints { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }
  .hint {
    appearance: none; cursor: pointer; border: 1px solid var(--rule); background: transparent;
    color: var(--dim); border-radius: 7px; padding: 7px 10px;
    font-family: var(--mono); font-size: 12px;
  }

  /* ---- DECK ----------------------------------------------------------- */
  .deck { padding: 0 14px; min-height: 100%; display: flex; flex-direction: column; }
  .deck-n {
    text-align: center; padding: 12px 0 14px; font-family: var(--mono);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
  }
  .deck-card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 20px;
    padding: 22px 20px; flex: 1; display: flex; flex-direction: column; min-height: 340px;
    animation: deal .28s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes deal { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .deck-card { animation: none; } }
  .deck-id { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin: 8px 0 3px; }
  .deck-meta { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .deck-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 0 18px; }
  .deck-acts .wide { grid-column: 1 / -1; }
  .deck-acts .btn { padding: 14px 8px; text-align: center; }
  .deck-acts a.btn { text-decoration: none; }
  .deck-zero { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; padding: 40px 24px; }
  .deck-zero .big { font-size: 42px; font-weight: 800; letter-spacing: -.03em; color: var(--calm); }
  .nav { display: flex; gap: 8px; justify-content: center; padding-bottom: 16px; }
  .nav .btn { padding: 8px 14px; font-size: 13px; }

  /* ---- PIPELINE ------------------------------------------------------- */
  .lanes { display: flex; gap: 11px; padding: 4px 14px 12px; overflow-x: auto; scroll-snap-type: x mandatory; }
  .lanes::-webkit-scrollbar { height: 0; }
  .lane { flex: 0 0 74%; scroll-snap-align: center; max-width: 300px; }
  .lane-hd {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px 10px 0 0;
    background: var(--panel2); border: 1px solid var(--rule); border-bottom: 0;
    font-family: var(--mono); font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  }
  .lane-hd .n { margin-left: auto; font-weight: 700; }
  .lane.needs .lane-hd { color: var(--alert); background: #FF5C4D14; border-color: #FF5C4D44; }
  .lane.work .lane-hd { color: var(--amber); }
  .lane.done .lane-hd { color: var(--calm); }
  .lane-body {
    border: 1px solid var(--rule); border-radius: 0 0 10px 10px; padding: 9px;
    display: grid; gap: 9px; align-content: start; min-height: 190px; background: var(--panel);
  }
  .lcard { background: var(--panel2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 11px; cursor: pointer; }
  .lcard .r1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .lcard .id { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .lcard .ago { margin-left: auto; font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .lcard .q { font-size: 12.5px; color: var(--dim); line-height: 1.45;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: flex; gap: 5px; justify-content: center; padding: 0 0 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); transition: background .2s; }
  .dot.on { background: var(--amber); }

  /* ---- PULSE ---------------------------------------------------------- */
  .hero { padding: 40px 24px 22px; text-align: center; cursor: pointer; border: 0; background: none;
          width: 100%; color: inherit; font: inherit; }
  .hero-n { font-family: var(--mono); font-size: 104px; line-height: .85; font-weight: 800;
            letter-spacing: -.055em; font-variant-numeric: tabular-nums; color: var(--alert); }
  .hero-n.zero { color: var(--calm); }
  .hero-cap { margin-top: 14px; font-family: var(--mono); font-size: 12px;
              letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .sum { display: flex; justify-content: center; gap: 20px; padding: 2px 0 22px;
         font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .sum b { color: var(--ink); font-weight: 700; }
  .fold { max-height: 0; overflow: hidden; transition: max-height .32s ease; }
  .fold.open { max-height: 1400px; }
  @media (prefers-reduced-motion: reduce) { .fold { transition: none; } }

  /* ---- dispatch dock -------------------------------------------------- */
  .dock { flex: none; border-top: 1px solid var(--rule); background: var(--panel);
          padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
  .dock .verbs { display: flex; gap: 5px; margin-bottom: 8px; }
  .dock .vb {
    appearance: none; cursor: pointer; flex: 1; border: 1px solid var(--rule);
    background: transparent; color: var(--dim); border-radius: 8px; padding: 9px 0;
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
  }
  .dock .vb[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #0A0E12; font-weight: 700; }
  .dock .row2 { display: flex; gap: 7px; }
  .dock input {
    background: #0A0E12; border: 1px solid var(--rule); color: var(--ink);
    border-radius: 8px; padding: 11px; font-size: 14px; font-family: var(--mono); min-width: 0;
  }
  .dock input:focus { outline: none; border-color: var(--amber); }
  .dock #dnum { width: 78px; text-align: center; }
  .dock #dtxt { flex: 1; font-family: inherit; }
  .dock input:disabled { opacity: .4; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 596px; margin-inline: auto; z-index: 20;
    background: var(--panel2); border: 1px solid var(--rule); border-left: 3px solid var(--amber);
    border-radius: 11px; padding: 12px 14px; font-family: var(--mono); font-size: 13px;
    transform: translateY(180%); transition: transform .24s cubic-bezier(.2,.7,.3,1);
  }
  .toast.show { transform: none; }
  .toast.bad { border-left-color: var(--alert); }
  .toast.good { border-left-color: var(--calm); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>clanker</h1>
    <span class="pip" id="health"></span>
    <span class="host mono" id="host">connecting…</span>
  </div>
  <nav class="views" id="views" role="tablist" aria-label="View"></nav>
</header>

<main id="main"><div class="empty">loading…</div></main>
<div id="dock"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var VIEWS = [
    { key: "triage",   label: "Triage" },
    { key: "command",  label: "Command" },
    { key: "deck",     label: "Deck" },
    { key: "pipeline", label: "Pipeline" },
    { key: "pulse",    label: "Pulse" }
  ];
  var VERBS = ["implement", "continue", "review", "new"];
  var SHORT = { implement: "csli", continue: "cslc", review: "cslr", new: "csln" };
  var CMD2VERB = { csli: "implement", cslc: "continue", cslr: "review", csln: "new" };
  // spawn names sessions <action>-<number>; map the action back to the verb that
  // produced it so a row can offer "cslc 5507" without you retyping anything.
  var ACT2VERB = { ship: "implement", revise: "continue", review: "review", new: "new" };

  var $ = function (id) { return document.getElementById(id); };
  var main = $("main"), dock = $("dock"), toastEl = $("toast");

  var view = localStorage.getItem("view") || "triage";
  var state = { agents: [], host: "", blocked: 0, live: 0, ok: false };
  var details = {};          // short id -> {link, preview}
  var openRow = null;        // finished row showing re-dispatch chips
  var openCard = {};         // short id -> preview expanded
  var deckAt = 0;
  var foldOpen = false;
  var dockVerb = localStorage.getItem("dockVerb") || "implement";
  var laneAt = 0;
  var log = [];
  try { log = JSON.parse(localStorage.getItem("cmdlog") || "[]"); } catch (e) { log = []; }

  var toastTimer;
  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "toast show " + (kind || "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = "toast"; }, 3200);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function age(ms) {
    if (!ms) return "";
    var s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 90) return Math.round(s) + "s";
    if (s < 5400) return Math.round(s / 60) + "m";
    if (s < 172800) return Math.round(s / 3600) + "h";
    return Math.round(s / 86400) + "d";
  }

  // "ship-5507" -> {verb:"implement", num:"5507"}; "new-2" -> {verb:"new"}
  function parseName(n) {
    var m = /^([a-z]+)-(\d{1,6})(?:-\d+)?$/.exec(n || "");
    if (m && ACT2VERB[m[1]]) return { verb: ACT2VERB[m[1]], num: m[2] };
    var b = /^([a-z]+)(?:-\d+)?$/.exec(n || "");
    if (b && ACT2VERB[b[1]]) return { verb: ACT2VERB[b[1]], num: "" };
    return { verb: "", num: "" };
  }

  function by(phase) {
    return state.agents.filter(function (a) { return a.phase === phase; });
  }
  var blocked = function () { return by("blocked"); };
  var working = function () { return state.agents.filter(function (a) { return a.live && a.phase !== "blocked"; }); };
  var finished = function () { return state.agents.filter(function (a) { return !a.live; }); };

  function pushLog(entry) {
    log.push(entry);
    if (log.length > 40) log = log.slice(-40);
    try { localStorage.setItem("cmdlog", JSON.stringify(log)); } catch (e) {}
  }
  function stamp() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  /* ---------------- api ------------------------------------------------ */
  function refresh(force) {
    return fetch("/api/state" + (force ? "?force=1" : ""), { cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) {
          document.body.innerHTML =
            '<p style="padding:26px;color:#7C8A99">Unauthorized — open this URL once with ' +
            "<code>?t=&lt;token&gt;</code>. Get it from <code>make ui-url</code>.</p>";
          throw new Error("401");
        }
        return r.json();
      })
      .then(function (d) {
        state = d;
        $("health").className = "pip " + (d.blocked ? "blocked" : "busy");
        var h = $("host");
        h.textContent = d.host + " · " + (d.blocked ? d.blocked + " blocked" : d.live + " live");
        h.className = "host mono" + (d.blocked ? " alert" : "");
        render();
      })
      .catch(function () {
        $("health").className = "pip";
        $("host").textContent = "unreachable";
      });
  }

  function loadDetail(shortId) {
    if (details[shortId] === "loading") return;
    details[shortId] = "loading";
    fetch("/api/session?id=" + encodeURIComponent(shortId), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { details[shortId] = d.ok ? d : null; render(); })
      .catch(function () { details[shortId] = null; });
  }

  function dispatch(verb, num, extra) {
    if (verb !== "new" && !/^\d{1,6}$/.test(num || "")) {
      toast("needs a ticket number", "bad");
      return Promise.resolve(false);
    }
    return fetch("/api/dispatch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ verb: verb, id: num || "", extra: extra || "" })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        toast(SHORT[verb] + " " + (num || "") + " · " + (d.message || "?"), d.ok ? "good" : "bad");
        pushLog({ ts: stamp(), txt: SHORT[verb] + " " + (num || "") + (extra ? " " + extra : ""), kind: "mut" });
        pushLog({ ts: stamp(), txt: "→ " + (d.detail || d.message || ""), kind: d.ok ? "ok" : "warn" });
        refresh(true);
        return d.ok;
      });
  }

  function stopAgent(name) {
    if (!confirm("Stop " + name + "?")) return;
    fetch("/api/stop", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    }).then(function (r) { return r.json(); })
      .then(function (d) { toast(d.message || "stopped", d.ok ? "good" : "bad"); refresh(true); });
  }

  /* ---------------- pieces --------------------------------------------- */
  function detailBlock(a) {
    var d = details[a.id];
    if (d === "loading" || d === undefined) return '<div class="prev">reading session…</div>';
    if (!d) return '<div class="prev">no output yet</div>';
    var body = (d.preview || []).map(esc).join("\n") || "no output yet";
    return '<div class="prev">' + body + "</div>";
  }

  function openInClaude(a) {
    var d = details[a.id];
    if (d && d.link) {
      return '<a class="btn primary" href="' + esc(d.link) + '" target="_blank" rel="noopener">Answer in Claude</a>';
    }
    return '<button class="btn" disabled>No deep link</button>';
  }

  /* ---------------- views ---------------------------------------------- */
  function vTriage() {
    var b = blocked(), w = working(), f = finished(), h = "";

    h += '<div class="lab' + (b.length ? " alert" : "") + '">Needs you</div>';
    if (!b.length) {
      h += '<div class="empty good">Nothing waiting.</div>';
    }
    b.forEach(function (a) {
      var p = parseName(a.name);
      if (details[a.id] === undefined) loadDetail(a.id);
      h += '<div class="card blocked">' +
             '<div class="card-top">' +
               (p.verb ? '<span class="verbtag ' + p.verb + '">' + p.verb + "</span>" : "") +
               '<span class="card-id mono">' + esc(a.name) + "</span>" +
               '<span class="card-age mono">' + age(a.startedAt) + "</span></div>" +
             detailBlock(a) +
             '<div class="acts">' + openInClaude(a) +
               '<button class="btn danger" data-stop="' + esc(a.name) + '">Stop</button></div>' +
           "</div>";
    });

    if (w.length) {
      h += '<div class="lab">Working · ' + w.length + "</div>";
      w.forEach(function (a) {
        var p = parseName(a.name);
        h += '<div class="strip" data-open="' + esc(a.id) + '">' +
               '<span class="pip ' + a.phase + '"></span>' +
               (p.verb ? '<span class="verbtag ' + p.verb + '">' + p.verb + "</span>" : "") +
               '<span class="nm' + (a.named ? "" : " unnamed") + '">' + esc(a.name) + "</span>" +
               '<span class="note">' + esc(a.repo) + " · " + age(a.startedAt) + "</span></div>";
        if (openCard[a.id]) {
          if (details[a.id] === undefined) loadDetail(a.id);
          h += '<div style="padding:0 4px 10px">' + detailBlock(a) +
               (a.kind === "background"
                 ? '<div class="rd">' + openInClaude(a) +
                   '<button class="btn danger" data-stop="' + esc(a.name) + '">Stop</button></div>'
                 : "") +
               "</div>";
        }
      });
    }

    if (f.length) {
      h += '<div class="lab">Finished · ' + f.length + "</div>";
      f.forEach(function (a) {
        var p = parseName(a.name);
        h += '<div class="strip" data-row="' + esc(a.id) + '">' +
               '<span class="pip ' + a.phase + '"></span>' +
               (p.verb ? '<span class="verbtag ' + p.verb + '">' + p.verb + "</span>" : "") +
               '<span class="nm' + (a.named ? "" : " unnamed") + '">' + esc(a.name) + "</span>" +
               '<span class="note">' + esc(a.phase) + " · " + age(a.startedAt) + "</span></div>";
        if (openRow === a.id) {
          h += '<div class="rd">';
          if (p.num) {
            ["continue", "review", "implement"].forEach(function (v) {
              h += '<button class="btn" data-rd="' + v + ":" + p.num + '">' +
                   SHORT[v] + " " + p.num + "</button>";
            });
          } else {
            h += '<span class="empty">no ticket number in this name</span>';
          }
          h += "</div>";
        }
      });
    }
    return h + '<div style="height:16px"></div>';
  }

  function vCommand() {
    var h = '<div class="log">';
    if (!log.length) {
      h += '<div class="ln"><span class="mut">no dispatches yet — try <b>csli 1234</b></span></div>';
    }
    log.forEach(function (l) {
      h += '<div class="ln"><span class="ts">' + esc(l.ts) + '</span>' +
           '<span class="txt ' + l.kind + '">' + esc(l.txt) + "</span></div>";
    });
    blocked().forEach(function (a) {
      var d = details[a.id];
      if (details[a.id] === undefined) loadDetail(a.id);
      h += '<div class="ask"><b>' + esc(a.name) + "</b> needs you" +
           (d && d.link ? ' — <a href="' + esc(d.link) + '" target="_blank" rel="noopener">answer in Claude</a>' : "") +
           "</div>";
    });
    h += "</div>";
    h += '<div class="cmdrow"><span class="caret">&gt;</span>' +
           '<input id="cmdin" placeholder="cslc 5507 rebase onto main" autocomplete="off" ' +
                  'autocapitalize="off" spellcheck="false" aria-label="command"></div>' +
         '<div class="hints">' +
           VERBS.map(function (v) {
             return '<button class="hint" data-cmd="' + SHORT[v] + '">' + SHORT[v] + " · " + v + "</button>";
           }).join("") +
         '</div><div style="height:18px"></div>';
    return h;
  }

  function vDeck() {
    var b = blocked();
    if (!b.length) {
      return '<div class="deck"><div class="deck-zero"><div class="big">0</div>' +
             '<div style="color:var(--dim);font-size:14px">Nothing waiting on you.</div>' +
             '<div class="mono" style="color:var(--dim);font-size:12px;letter-spacing:.1em">' +
               working().length + " RUNNING · " + finished().length + " DONE</div></div></div>";
    }
    if (deckAt >= b.length) deckAt = 0;
    var a = b[deckAt], p = parseName(a.name);
    if (details[a.id] === undefined) loadDetail(a.id);
    return '<div class="deck">' +
      '<div class="deck-n">' + (deckAt + 1) + " of " + b.length + " waiting</div>" +
      '<div class="deck-card">' +
        (p.verb ? '<span class="verbtag ' + p.verb + '" style="align-self:flex-start">' + p.verb + "</span>" : "") +
        '<div class="deck-id mono">' + esc(a.name) + "</div>" +
        '<div class="deck-meta mono">' + esc(a.repo) + " · blocked " + age(a.startedAt) + "</div>" +
        detailBlock(a) +
      "</div>" +
      '<div class="deck-acts">' +
        '<div class="wide">' + openInClaude(a) + "</div>" +
        '<button class="btn" data-deck="next">Next</button>' +
        '<button class="btn danger" data-stop="' + esc(a.name) + '">Stop</button>' +
      "</div></div>";
  }

  function vPipeline() {
    var lanes = [
      { cls: "needs", label: "Needs you", rows: blocked() },
      { cls: "work", label: "Working", rows: working() },
      { cls: "done", label: "Finished", rows: finished() }
    ];
    var h = '<div class="lanes" id="lanes">';
    lanes.forEach(function (L) {
      h += '<div class="lane ' + L.cls + '"><div class="lane-hd"><span>' + L.label +
           '</span><span class="n">' + L.rows.length + "</span></div><div class=\"lane-body\">";
      if (!L.rows.length) h += '<div class="empty" style="padding:8px">empty</div>';
      L.rows.forEach(function (a) {
        var p = parseName(a.name);
        h += '<div class="lcard" data-open="' + esc(a.id) + '">' +
               '<div class="r1">' +
                 (p.verb ? '<span class="verbtag ' + p.verb + '">' + p.verb + "</span>" : "") +
                 '<span class="id">' + esc(a.name) + "</span>" +
                 '<span class="ago">' + age(a.startedAt) + "</span></div>" +
               '<div class="q">' + esc(a.repo) + " · " + esc(a.phase) + "</div>";
        if (openCard[a.id]) {
          if (details[a.id] === undefined) loadDetail(a.id);
          h += detailBlock(a);
          if (a.live && a.kind === "background") {
            h += '<div class="rd" style="padding:8px 0 0">' + openInClaude(a) + "</div>";
          }
        }
        h += "</div>";
      });
      h += "</div></div>";
    });
    h += "</div><div class=\"dots\">" +
      [0, 1, 2].map(function (n) { return '<span class="dot' + (n === laneAt ? " on" : "") + '"></span>'; }).join("") +
      "</div>";
    return h;
  }

  function vPulse() {
    var n = blocked().length;
    var h = '<button class="hero" id="hero" aria-expanded="' + foldOpen + '">' +
              '<div class="hero-n' + (n ? "" : " zero") + '">' + n + "</div>" +
              '<div class="hero-cap">' + (n ? "waiting on you" : "all clear") + "</div></button>" +
            '<div class="sum"><span><b>' + working().length + "</b> running</span>" +
              "<span><b>" + finished().length + "</b> done</span></div>" +
            '<div class="fold' + (foldOpen ? " open" : "") + '">';
    var all = blocked().concat(working(), finished());
    if (!all.length) h += '<div class="empty">no sessions</div>';
    all.forEach(function (a) {
      var p = parseName(a.name);
      h += '<div class="strip" data-open="' + esc(a.id) + '">' +
             '<span class="pip ' + a.phase + '"></span>' +
             (p.verb ? '<span class="verbtag ' + p.verb + '">' + p.verb + "</span>" : "") +
             '<span class="nm' + (a.named ? "" : " unnamed") + '">' + esc(a.name) + "</span>" +
             '<span class="note">' + esc(a.phase) + " · " + age(a.startedAt) + "</span></div>";
      if (openCard[a.id]) {
        if (details[a.id] === undefined) loadDetail(a.id);
        h += '<div style="padding:0 4px 10px">' + detailBlock(a) +
             (a.live && a.kind === "background"
               ? '<div class="rd">' + openInClaude(a) + "</div>" : "") + "</div>";
      }
    });
    h += "</div>";
    if (!foldOpen) h += '<div class="empty" style="text-align:center;padding:20px">Tap the number for detail</div>';
    return h;
  }

  var RENDER = { triage: vTriage, command: vCommand, deck: vDeck, pipeline: vPipeline, pulse: vPulse };

  /* ---------------- dock ------------------------------------------------ */
  function dockHTML() {
    // Command has its own input; Deck is a queue you answer, not a form.
    if (view === "command" || view === "deck") return "";
    var needsId = dockVerb !== "new";
    return '<div class="dock"><div class="verbs">' +
      VERBS.map(function (v) {
        return '<button class="vb" data-verb="' + v + '" aria-pressed="' + (dockVerb === v) + '">' + v + "</button>";
      }).join("") +
      '</div><div class="row2">' +
        '<input id="dnum" inputmode="numeric" pattern="[0-9]*" placeholder="0000" ' +
               'aria-label="ticket number"' + (needsId ? "" : " disabled") + ">" +
        '<input id="dtxt" placeholder="optional description" aria-label="description" autocomplete="off">' +
        '<button class="btn primary" id="dgo">Go</button>' +
      "</div></div>";
  }

  /* ---------------- render ---------------------------------------------- */
  function render() {
    var keepScroll = main.scrollTop;
    main.innerHTML = RENDER[view]();
    dock.innerHTML = dockHTML();
    main.scrollTop = keepScroll;
    var lanes = $("lanes");
    if (lanes) {
      lanes.scrollLeft = laneAt * (lanes.firstChild ? lanes.firstChild.offsetWidth + 11 : 0);
      lanes.addEventListener("scroll", function () {
        var w = lanes.firstChild ? lanes.firstChild.offsetWidth + 11 : 1;
        var i = Math.round(lanes.scrollLeft / w);
        if (i !== laneAt) {
          laneAt = i;
          var dots = document.querySelectorAll(".dot");
          for (var k = 0; k < dots.length; k++) dots[k].classList.toggle("on", k === laneAt);
        }
      }, { passive: true });
    }
  }

  /* ---------------- events ---------------------------------------------- */
  VIEWS.forEach(function (v) {
    var b = document.createElement("button");
    b.className = "vtab";
    b.textContent = v.label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(v.key === view));
    b.onclick = function () {
      view = v.key;
      localStorage.setItem("view", view);
      deckAt = 0; openRow = null; foldOpen = false;
      var tabs = $("views").children;
      for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute("aria-selected", String(VIEWS[i].key === view));
      main.scrollTop = 0;
      render();
    };
    $("views").appendChild(b);
  });

  main.addEventListener("click", function (e) {
    var t = e.target.closest("[data-stop],[data-rd],[data-row],[data-open],[data-cmd],[data-deck],#hero");
    if (!t) return;
    if (t.id === "hero") { foldOpen = !foldOpen; return render(); }
    if (t.dataset.stop) return stopAgent(t.dataset.stop);
    if (t.dataset.deck === "next") { deckAt = (deckAt + 1) % Math.max(1, blocked().length); return render(); }
    if (t.dataset.rd) {
      var parts = t.dataset.rd.split(":");
      openRow = null;
      return dispatch(parts[0], parts[1], "");
    }
    if (t.dataset.row) { openRow = openRow === t.dataset.row ? null : t.dataset.row; return render(); }
    if (t.dataset.open) {
      openCard[t.dataset.open] = !openCard[t.dataset.open];
      return render();
    }
    if (t.dataset.cmd) {
      var inp = $("cmdin");
      if (inp) { inp.value = t.dataset.cmd + " "; inp.focus(); }
    }
  });

  main.addEventListener("keydown", function (e) {
    if (e.target.id !== "cmdin" || e.key !== "Enter") return;
    var raw = e.target.value.trim();
    if (!raw) return;
    var m = /^(csli|cslc|cslr|csln|implement|continue|review|new)\s*(\d{0,6})\s*([\s\S]*)$/i.exec(raw);
    if (!m) { toast("unknown command", "bad"); return; }
    var key = m[1].toLowerCase();
    var verb = CMD2VERB[key] || key;
    e.target.value = "";
    dispatch(verb, m[2], m[3].trim()).then(function () {
      var inp = $("cmdin");
      if (inp) inp.focus();
      main.scrollTop = main.scrollHeight;
    });
  });

  dock.addEventListener("click", function (e) {
    var v = e.target.closest("[data-verb]");
    if (v) {
      dockVerb = v.dataset.verb;
      localStorage.setItem("dockVerb", dockVerb);
      return render();
    }
    if (e.target.id === "dgo") {
      var num = $("dnum"), txt = $("dtxt");
      dispatch(dockVerb, num ? num.value.trim() : "", txt ? txt.value.trim() : "")
        .then(function (ok) { if (ok) { if (num) num.value = ""; if (txt) txt.value = ""; } });
    }
  });

  dock.addEventListener("keydown", function (e) {
    if ((e.target.id === "dnum" || e.target.id === "dtxt") && e.key === "Enter") {
      var go = $("dgo");
      if (go) go.click();
    }
  });

  render();
  refresh();
  setInterval(refresh, 5000);
  // Phones freeze timers in a backgrounded tab; without this the list is stale
  // for however long it took you to walk back to it.
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(true); });
})();
</script>
</body>
</html>
